# https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
modLoader="javafml"
loaderVersion="[${fml},)"
license="MIT"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
description="This mod/datapack enhances vanilla crafting by making them a lot faster."
license="MIT"

[[dependencies.${id}]]
modId="forge"
mandatory=true
versionRange="[${fml},)"
ordering="NONE"
side="BOTH"

[[dependencies.${id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="${id}.mixins.json"
